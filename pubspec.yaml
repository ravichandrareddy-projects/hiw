name: hiw
description: "HIW - Health Is Wealth"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0
  flutter_spinkit: ^5.2.0
  animated_text_kit: ^4.2.2

  # Camera & Image
  camera: ^0.10.5+5
  image: ^4.1.3

  # 🧠 LOCAL STORAGE (HIVE)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # (ML LATER – API based)
  # tflite_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

  # 🛠 CODE GENERATION
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/christmas/
    - assets/ml/labels.txt
